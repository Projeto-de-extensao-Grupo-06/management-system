name: E2E Tests

on:
  push:
    branches: [ main, feat/e2e-tests ]
  pull_request:
    branches: [ main ]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout management-system
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r e2e/requirements.txt
          playwright install --with-deps

      - name: Checkout infrastructure
        uses: actions/checkout@v4
        with:
          repository: Projeto-de-extensao-Grupo-06/infrastructure
          path: infrastructure

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start Database and Backend Services
        run: |
          docker network create storage_network || true
          docker network create solarway_network || true
          
          # Setup environment variable defaults
          cp infrastructure/.env.example infrastructure/.env
          
          echo "Starting Database..."
          cd infrastructure/services/db
          docker compose --env-file ../../.env up -d
          
          echo "Starting Backend Monolith..."
          cd ../backend/monolith
          DB_HOST=mysql-db-oltp docker compose --env-file ../../../.env up -d
          
          # Give the database and backend enough time to initialize
          echo "Waiting 60 seconds for backend to be fully started..."
          sleep 60
          
          # Print logs in case of failure for debugging
          docker ps
          docker logs backend-service || true

      - name: Start frontend service (Docker)
        run: |
          # Build the Docker image from the current repository
          docker build -t frontend .
          
          # Run the frontend connected to the backend's network.
          # Here we point BACKEND_URL to the internal backend container's IP/port.
          docker run -d -p 80:80 \
            --network solarway_network \
            -e BACKEND_URL="http://backend-service:8000" \
            frontend
            
          # Give the container a few seconds to initialize
          sleep 5

      - name: Run E2E Tests
        env:
          BASE_URL: http://localhost:80
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          HEADLESS: "true"
        run: |
          pytest e2e/tests --html=report.html --self-contained-html

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: report.html
